<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="refresh" content="0; url=./ironplan.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IronPlan Redirect</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --card: #16181c;
      --ink: #f2f4f0;
      --mut: #8b919a;
      --line: #2a2e35;
      --acc: #c6ff3d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 20px;
      text-align: center;
      max-width: 420px;
      width: calc(100% - 32px);
    }
    .tag {
      color: var(--acc);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 11px;
      font-weight: 800;
    }
    a {
      color: var(--acc);
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">IronPlan</div>
    <h1>Redirecting…</h1>
    <p>If you are not redirected automatically, open <a href="./ironplan.html">ironplan.html</a>.</p>
  </div>
</body>
</html>
