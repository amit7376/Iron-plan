<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronPlan – Personal Trainer</title>
<style>
:root{--bg:#0b0c0e;--card:#16181c;--c2:#1e2126;--ink:#f2f4f0;--mut:#8b919a;--line:#2a2e35;--acc:#c6ff3d;--on:#0b0c0e;--ok:#c6ff3d;--bad:#ff5b5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme="light"]{--bg:#f3f4f1;--card:#fff;--c2:#eef0ea;--ink:#14161a;--mut:#6b7280;--line:#dfe2dc;--acc:#4d9a00;--on:#fff;--ok:#4d9a00;--bad:#d62f2f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;max-width:640px;margin:auto;padding:10px 12px 120px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.4px}h1 span{color:var(--acc)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--c2);color:var(--ink);padding:9px 13px;border-radius:999px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700}
select,input,textarea,button{font:inherit;color:var(--ink)}
select,input[type=number],input[type=text],textarea{background:var(--c2);border:1px solid var(--line);border-radius:10px;padding:9px 6px;width:100%;min-height:40px}
textarea{min-height:90px;font-size:13px}
.btn{background:var(--acc);color:var(--on);border:0;border-radius:14px;padding:13px 16px;font-weight:800;cursor:pointer;width:100%;min-height:46px}
.btn.s{background:var(--c2);color:var(--ink);border:1px solid var(--line);font-weight:600;width:auto;padding:9px 12px;min-height:40px;font-size:13px}
.btn.d{color:var(--bad)}
.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.tag{font-size:11px;color:var(--acc);font-weight:800;text-transform:uppercase;letter-spacing:.7px}
.mut{color:var(--mut);font-size:13px}
.big{font:800 44px/1 ui-monospace,Menlo,monospace;letter-spacing:-1px;text-align:center;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:24px 1fr 1fr 42px;gap:6px;align-items:center;margin-top:8px}
.hd{font-size:11px;color:var(--mut)}
.ck{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--c2);cursor:pointer;font-size:18px;color:var(--mut)}
.ck.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.sug{background:var(--c2);border-left:3px solid var(--acc);border-radius:8px;padding:8px 10px;margin-top:10px;font-size:13px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{display:flex;max-width:640px;margin:auto}
.nav button{flex:1;background:none;border:0;padding:10px 0 9px;color:var(--mut);font-size:11px;font-weight:700;cursor:pointer}
.nav button b{display:block;font-size:19px}.nav button.on{color:var(--acc)}
#rb{position:fixed;left:12px;right:12px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;background:var(--acc);color:var(--on);border-radius:14px;padding:10px 14px;font-weight:800;display:none;justify-content:space-between;align-items:center;z-index:6}
#rb button{background:var(--on);color:var(--acc);border:0;border-radius:9px;padding:6px 10px;font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:12px}
#modal>div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;width:100%;max-width:560px;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--acc);color:var(--on);padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}.toast.err{background:var(--bad);color:#fff}
.bar{height:8px;background:var(--c2);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.stat{background:var(--c2);border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:22px}
.vb{display:flex;gap:4px;align-items:flex-end;height:90px}.vb i{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:3px}
.badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--bad);color:#fff}
.hide{display:none}.p0{padding:0}
.gif{position:relative;height:210px;border-radius:12px;overflow:hidden;background:#fff;margin-top:8px}
.gif img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.gif img+img{animation:fl 1.3s steps(1) infinite}
@keyframes fl{0%{opacity:0}50%{opacity:1}}
.gif.x{display:none}
details.demo summary{cursor:pointer;color:var(--acc);font-weight:700;font-size:13px;margin-top:10px}
svg text{fill:var(--mut);font-size:10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="rb"><span>⏱ Rest <span id="rt"></span></span><button data-a="restx">Skip</button></div>
<div class="nav"><div id="nav"></div></div>
<div id="modal"><div id="mb"></div></div>
<div class="toast" id="toast"></div>
<script>
// ---------- data ----------
const MUS=["Chest","Back","Shoulders","Biceps","Triceps","Legs","Core","Cardio","Mobility"];
const TY={r:"Weight × reps",b:"Bodyweight × reps",t:"Timed (sec)",c:"Cardio (min)"};
// m|*name (*=compound)|type|variations
const LIB=`Chest|*Barbell Bench Press|r|Flat,Close Grip,Paused,Smith Machine
Chest|*Dumbbell Bench Press|r|Flat,Neutral Grip,Single Arm
Chest|*Incline Dumbbell Press|r|30°,45°,Neutral Grip

Back|Pull-Up|b|Pronated,Neutral,Assisted
Shoulders|*Dumbbell Shoulder Press|r|Seated,Standing,Arnold
Shoulders|*Machine Shoulder Press|r|Seated,Neutral Grip
Shoulders|Lateral Raise|r|Dumbbell,Cable,Machine,Leaning
Shoulders|Rear Delt Fly|r|Dumbbell,Cable,Machine
Shoulders|Face Pull|r|Rope,Band
Biceps|Dumbbell Curl|r|Standing,Alternating,Incline
Biceps|Hammer Curl|r|Dumbbell,Rope Cable,Cross-Body
Biceps|Preacher Curl|r|EZ Bar,Dumbbell,Machine
Biceps|Cable Curl|r|Bar,Single Arm,Overhead
Triceps|Rope Pushdown|r|Standard,Single Arm
Triceps|Straight-Bar Pushdown|r|Straight Bar,V-Bar
Triceps|Overhead Triceps Extension|r|Dumbbell,Cable,EZ Bar
Triceps|Skull Crusher|r|EZ Bar,Dumbbell
Legs|*Goblet Squat|r|Dumbbell,Kettlebell,Box
Legs|*Leg Press|r|45°,Horizontal,Single Leg
Legs|Leg Extension|r|Both Legs,Single Leg
Legs|Leg Curl|r|Lying,Seated
Legs|Calf Raise|r|Standing,Seated,Leg Press
Core|Plank|t|Standard,Side,Weighted
Core|Dead Bug|b|Standard,Weighted
Core|Cable Crunch|r|Rope,Kneeling
Core|Hanging Leg Raise|b|Straight Leg,Bent Knee
Cardio|Treadmill Walk|c|Flat,Incline
Cardio|Stationary Bike|c|Steady,Intervals
Cardio|Rowing Machine|c|Steady,Intervals
Mobility|Cat-Cow|t|Standard
Mobility|Hip Flexor Stretch|t|Half Kneeling,Standing
Mobility|Thoracic Rotation|t|Open Book,Quadruped`.split("\n").map(l=>{const[m,n,t,v]=l.split("|");return{m,n:n.replace("*",""),c:n[0]==="*",t,v:v.split(",")}});
const GIF={"Barbell Bench Press":{"b":"Barbell_Bench_Press_-_Medium_Grip","v":{"Close Grip":"Close-Grip_Barbell_Bench_Press","Smith Machine":"Smith_Machine_Bench_Press"}},"Dumbbell Bench Press":{"b":"Dumbbell_Bench_Press","v":{"Neutral Grip":"Dumbbell_Bench_Press_with_Neutral_Grip","Single Arm":"One_Arm_Dumbbell_Bench_Press"}},"Incline Dumbbell Press":{"b":"Incline_Dumbbell_Press","v":{"Neutral Grip":"Hammer_Grip_Incline_DB_Bench_Press"}},"Machine Chest Press":{"b":"Machine_Bench_Press"},"Cable Fly":{"b":"Cable_Crossover","v":{"Low-to-High":"Low_Cable_Crossover","Single Arm":"Single-Arm_Cable_Crossover"}},"Pec Deck":{"b":"Butterfly"},"Push-Up":{"b":"Pushups","v":{"Incline":"Incline_Push-Up","Decline":"Decline_Push-Up","Diamond":"Push-Ups_-_Close_Triceps_Position"}},"Lat Pulldown":{"b":"Wide-Grip_Lat_Pulldown","v":{"Close Grip":"Close-Grip_Front_Lat_Pulldown","Single Arm":"One_Arm_Lat_Pulldown"}},"Seated Cable Row":{"b":"Seated_Cable_Rows"},"Chest-Supported Row":{"b":"Lying_T-Bar_Row","v":{"T-Bar":"T-Bar_Row_with_Handle"}},"One-Arm Dumbbell Row":{"b":"One-Arm_Dumbbell_Row"},"Romanian Deadlift":{"b":"Romanian_Deadlift"},"Pull-Up":{"b":"Pullups","v":{"Assisted":"Band_Assisted_Pull-Up"}},"Dumbbell Shoulder Press":{"b":"Dumbbell_Shoulder_Press","v":{"Arnold":"Arnold_Dumbbell_Press"}},"Machine Shoulder Press":{"b":"Machine_Shoulder_Military_Press"},"Lateral Raise":{"b":"Side_Lateral_Raise","v":{"Cable":"Cable_Seated_Lateral_Raise"}},"Rear Delt Fly":{"b":"Reverse_Flyes","v":{"Cable":"Cable_Rear_Delt_Fly","Machine":"Reverse_Machine_Flyes"}},"Face Pull":{"b":"Face_Pull"},"Dumbbell Curl":{"b":"Dumbbell_Bicep_Curl","v":{"Alternating":"Dumbbell_Alternate_Bicep_Curl","Incline":"Incline_Dumbbell_Curl"}},"Hammer Curl":{"b":"Hammer_Curls","v":{"Rope Cable":"Cable_Hammer_Curls_-_Rope_Attachment","Cross-Body":"Cross_Body_Hammer_Curl"}},"Preacher Curl":{"b":"Preacher_Curl","v":{"Dumbbell":"One_Arm_Dumbbell_Preacher_Curl","Machine":"Machine_Preacher_Curls"}},"Cable Curl":{"b":"Standing_Biceps_Cable_Curl","v":{"Single Arm":"Standing_One-Arm_Cable_Curl","Overhead":"Overhead_Cable_Curl"}},"Rope Pushdown":{"b":"Triceps_Pushdown_-_Rope_Attachment"},"Straight-Bar Pushdown":{"b":"Triceps_Pushdown","v":{"V-Bar":"Triceps_Pushdown_-_V-Bar_Attachment"}},"Overhead Triceps Extension":{"b":"Cable_Rope_Overhead_Triceps_Extension","v":{"Dumbbell":"Standing_Dumbbell_Triceps_Extension"}},"Skull Crusher":{"b":"EZ-Bar_Skullcrusher"},"Goblet Squat":{"b":"Goblet_Squat"},"Leg Press":{"b":"Leg_Press","v":{"Narrow Stance":"Narrow_Stance_Leg_Press"}},"Leg Extension":{"b":"Leg_Extensions","v":{"Single Leg":"Single-Leg_Leg_Extension"}},"Leg Curl":{"b":"Lying_Leg_Curls","v":{"Seated":"Seated_Leg_Curl"}},"Calf Raise":{"b":"Standing_Calf_Raises","v":{"Seated":"Seated_Calf_Raise"}},"Plank":{"b":"Plank"},"Dead Bug":{"b":"Dead_Bug"},"Cable Crunch":{"b":"Cable_Crunch"},"Hanging Leg Raise":{"b":"Hanging_Leg_Raise"},"Treadmill Walk":{"b":"Walking_Treadmill"},"Stationary Bike":{"b":"Recumbent_Bike"},"Rowing Machine":{"b":"Rowing_Stationary"},"Cat-Cow":{"b":"Cat_Stretch"},"Hip Flexor Stretch":{"b":"Kneeling_Hip_Flexor","v":{"Standing":"Standing_Hip_Flexors"}}};
const IMG="https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/";
const PRE={"Chest + Shoulders + Triceps":["Chest","Shoulders","Triceps"],"Back + Biceps":["Back","Biceps"],"Legs + Core":["Legs","Core"],"Full Body":"fb","Custom Workout":"custom"};
const WS=[];for(let w=0;w<=200;w+=2.5)WS.push(w);
const VAL={r:[1,2,3,4,5,6,8,10,12,15,20,25,30],b:[1,2,3,4,5,6,8,10,12,15,20,25,30],t:[10,15,20,30,45,60,90,120,180],c:[5,10,15,20,25,30,45,60]};
const UN={r:"reps",b:"reps",t:"sec",c:"min"};
// ---------- helpers / storage ----------
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mem={},KEYS=["ip2_hist","ip2_cfg","ip2_plan","ip2_sess","ip2_media"];let db=null,stName="none";
const idb={open:()=>new Promise(r=>{try{const q=indexedDB.open("ironplan",1);q.onupgradeneeded=()=>q.result.createObjectStore("kv");q.onsuccess=()=>{db=q.result;r(true)};q.onerror=q.onblocked=()=>r(false)}catch(e){r(false)}}),
 get:k=>new Promise(r=>{try{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined)}catch(e){r(undefined)}}),
 put:(k,v)=>new Promise(r=>{if(!db)return r(false);try{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>r(true);t.onerror=t.onabort=()=>r(false)}catch(e){r(false)}})};
const ls={g:(k,d)=>mem[k]===undefined?d:mem[k],async s(k,v){mem[k]=v;let l=false;try{const t=JSON.stringify(v);localStorage.setItem(k,t);l=localStorage.getItem(k)===t}catch(e){}return(await idb.put(k,v))||l}};
async function loadAll(){const ok=await idb.open();for(const k of KEYS){let v=ok?await idb.get(k):undefined;if(v===undefined){try{const t=localStorage.getItem(k);if(t)v=JSON.parse(t)}catch(e){}}if(v!==undefined)mem[k]=v}
 stName=ok?"IndexedDB":(()=>{try{localStorage.setItem("ip2_t","1");return"localStorage"}catch(e){return"none"}})();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
let hist=[],cfg={theme:"dark",rest:60,auto:true},sel=new Set(["Chest","Shoulders","Triceps"]),fb=false,plan=[],pname="",sess=null,media={},rest={end:0},tab="today",filt={r:"all",m:"all"},open=new Set(),progKey="",pend=null,dl=null;
async function boot(){await loadAll();hist=ls.g("ip2_hist",[]);cfg=Object.assign(cfg,ls.g("ip2_cfg",{}));media=ls.g("ip2_media",{});const P=ls.g("ip2_plan",null);if(P){sel=new Set(P.sel);fb=!!P.fb;plan=P.plan;pname=P.name}sess=ls.g("ip2_sess",null);if(!plan.length&&!sess)gen(true);render();tick()}
const save=()=>{ls.s("ip2_plan",{sel:[...sel],fb,plan,name:pname});ls.s("ip2_sess",sess)};
const $$=(a,cur,f)=>a.map(x=>`<option value="${esc(x)}" ${String(x)===String(cur)?"selected":""}>${esc(f?f(x):x)}</option>`).join("");
const fmtD=d=>new Date(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const fmtT=s=>{s=Math.max(0,Math.floor(s));return[s/3600|0,(s/60|0)%60,s%60].map(x=>String(x).padStart(2,"0")).join(":")};
const el=()=>sess?sess.acc+(sess.run?Date.now()-sess.since:0):0;
function toast(t,e){const x=$("#toast");x.textContent=t;x.className="toast show"+(e?" err":"");clearTimeout(toast.h);toast.h=setTimeout(()=>x.className="toast",2400)}
const done=it=>it.sets.filter(s=>s.done);
const wk=()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d};
const rnd=a=>a[Math.floor(Math.random()*a.length)],shuf=a=>[...a].sort(()=>Math.random()-.5);
// ---------- exercise / plan building ----------
function mk(ex){const r=ex.t==="r"?(ex.c?8:12):ex.t==="b"?10:ex.t==="t"?45:15;const n=ex.t==="c"?1:3;
 return{id:uid(),n:ex.n,m:ex.m,t:ex.t,v:ex.v[0],tr:r,rest:ex.t==="c"?0:ex.c?90:ex.t==="t"?30:60,note:"",sets:Array.from({length:n},()=>({w:0,r,done:false}))}}
function gen(quiet){
 let ex=[];
 if(fb){const g=(m,f)=>rnd(LIB.filter(x=>x.m===m&&(!f||f(x))));
  ex=[g("Chest",x=>x.c),g("Back",x=>x.c&&x.n!=="Romanian Deadlift"),g("Legs",x=>x.c),LIB.find(x=>x.n==="Romanian Deadlift"),g("Shoulders",x=>x.c),g(rnd(["Biceps","Triceps"])),g("Core")];pname="Full Body"}
 else{const gs=MUS.filter(m=>sel.has(m));if(!gs.length){if(!quiet)toast("Pick at least one muscle group",1);return}
  const st=gs.filter(m=>m!=="Cardio"&&m!=="Mobility"),tot=st.length?Math.min(8,Math.max(5,st.length*2+1)):0,cnt={};
  st.forEach(m=>cnt[m]=0);for(let i=0,k=0;i<tot&&k<60;k++){const m=st[k%st.length];if(cnt[m]<LIB.filter(x=>x.m===m).length){cnt[m]++;i++}}
  gs.forEach(m=>{const pool=LIB.filter(x=>x.m===m),n=cnt[m]??1;const c=shuf(pool.filter(x=>x.c)),o=shuf(pool.filter(x=>!x.c));ex.push(...[...c.slice(0,1),...o,...c.slice(1)].slice(0,n))});
  pname=gs.join(" + ")}
 plan=ex.filter(Boolean).map(mk);save();if(!quiet)toast("Plan ready 💪")}
// ---------- history lookup / suggestions ----------
function prev(it){let any=null;for(let i=hist.length-1;i>=0;i--){const x=hist[i].items.find(y=>y.n===it.n&&done(y).length);if(x){if(x.v===it.v)return{x,d:hist[i].date,same:1};if(!any)any={x,d:hist[i].date,same:0}}}return any}
function desc(x){const d=done(x),u=UN[x.t];if(x.t==="r"||x.t==="b"){const w=d.map(s=>s.w);if(w.every(a=>a===w[0]))return`${w[0]?w[0]+" kg":"bodyweight"}: ${d.map(s=>s.r).join(", ")} reps`;return d.map(s=>`${s.w||"BW"}×${s.r}`).join(", ")}return d.map(s=>s.r).join(", ")+" "+u}
function sug(it){const p=prev(it);if(!p)return`<div class="sug">First logged session for this exercise — pick a comfortable starting weight.</div>`;
 const x=p.x,d=done(x),ok=d.length>=x.sets.length&&d.every(s=>s.r>=x.tr);let t;
 if(!p.same)t=`Last logged as <b>${esc(x.v)}</b> on ${fmtD(p.d)} (${esc(desc(x))}). Weights aren’t directly comparable between variations — start lighter and build up.`;
 else if(ok)t=`Last time (${fmtD(p.d)}) you completed ${esc(desc(x))} — every target rep. Repeat the same weight, or consider a small increase if form stayed controlled. Your call; nothing changes automatically.`;
 else t=`Last time (${fmtD(p.d)}) you completed ${esc(desc(x))} (target ${x.tr} × ${x.sets.length} sets). Consider repeating the same weight and aiming to hit all target reps with controlled form; reduce slightly if it felt too hard.`;
 return`<div class="sug">${t}<div style="margin-top:8px"><button class="btn s" data-a="apply">Apply Previous Performance</button></div></div>`}
function apply(it){const p=prev(it);if(!p)return;const x=p.x;it.v=x.v;it.t=x.t;it.tr=x.tr;it.rest=x.rest;it.sets=x.sets.map(s=>({w:s.w,r:s.r,done:false}))}
function prs(){const best={},out=[];[...hist].sort((a,b)=>a.date<b.date?-1:1).forEach(h=>h.items.forEach(i=>{if(i.t!=="r")return;const w=Math.max(0,...done(i).map(s=>s.w));if(!w)return;const k=i.n+" · "+i.v;if(best[k]!=null&&w>best[k])out.push({k,w,d:h.date});if(best[k]==null||w>best[k])best[k]=w}));return out.reverse()}
// ---------- views ----------
const chips=()=>`<div class="chips">${MUS.map(m=>`<button class="chip ${!fb&&sel.has(m)?"on":""}" data-a="m" data-m="${m}">${m}</button>`).join("")}<button class="chip ${fb?"on":""}" data-a="m" data-m="__fb">Full Body</button></div>`;
function vToday(){const wkN=hist.filter(h=>new Date(h.date)>=wk()).length,l=hist[hist.length-1],pr=prs().slice(0,3);
 const main=["Chest","Back","Shoulders","Biceps","Triceps","Legs","Core"],ls2={};hist.forEach(h=>h.items.forEach(i=>{if(done(i).length&&(!ls2[i.m]||h.date>ls2[i.m]))ls2[i.m]=h.date}));
 let tip="Log your first workout — your history will start shaping suggestions right away.";
 if(hist.length){const a=main.map(m=>({m,d:ls2[m]?Math.floor((Date.now()-new Date(ls2[m]))/864e5):1e9})).sort((a,b)=>b.d-a.d)[0];tip=a.d===1e9?`You haven’t logged any ${a.m} work yet — consider adding it to a session.`:`${a.m} was last trained ${a.d} day${a.d===1?"":"s"} ago — a good candidate for your next session.`}
 return`<div class="mut">${new Date().toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
 <div class="card" style="margin-top:10px"><span class="tag">Today’s plan</span><div style="font-size:20px;font-weight:800;margin:2px 0 6px">${esc(pname||"No plan yet")}</div>

 case"del":ask(`Remove <b>${esc(it.n)}</b> from this workout?`,"Remove",()=>{plan.splice(+c.dataset.i,1);X();R()});break;
 case"repl":{const i=+c.dataset.i;pick(n=>{plan[i]=mk(LIB.find(x=>x.n===n))},"Replace");break}
 case"addex":pick(n=>{plan.push(mk(LIB.find(x=>x.n===n)))},"Add");break;
 case"pok":{const n=$("#pk").value,f=pend;X();f(n);R();break}
 case"mok":{const f=pend;if(f)f();else X();break}
 case"mno":X();break;
 case"tog":open.has(hid)?open.delete(hid):open.add(hid);render();break;
 case"rep":{if(sess){toast("Finish or reset the current workout first",1);break}const r=hist.find(h=>h.id===hid);plan=r.items.map(i=>({...JSON.parse(JSON.stringify(i)),id:uid(),sets:i.sets.map(s=>({w:s.w,r:s.r,done:false}))}));pname=r.name;tab="work";R();toast("Loaded as a new session — original untouched");break}
 case"delh":ask("Delete this workout permanently?","Delete",async()=>{if(await persistHist(hist.filter(h=>h.id!==hid))){X();render();toast("Deleted")}else toast("Delete failed — storage error",1)});break;
 case"exj":exportData("j");break;case"exc":exportData("c");break;
 case"dls":(async()=>{const blob=new Blob([dl.c],{type:dl.t});try{const d=window.claude&&await claude.use("downloads");if(d){await d.save({filename:dl.f,data:blob});toast("File saved");return}}catch(e){if(e&&e.code==="declined")return}
  try{const u=URL.createObjectURL(blob),l=document.createElement("a");l.href=u;l.download=dl.f;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Downloading "+dl.f)}catch(e){toast("Couldn’t save — use Copy text",1)}})();break;
 case"cp":{const x=$("#ex");x.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(dl.c).then(()=>toast("Copied")).catch(()=>toast("Select the text and copy manually",1));else toast(ok?"Copied":"Select the text and copy manually",!ok);break}
 case"med":M(`<b>Your own GIF / image for ${esc(it.n)}</b><div class="mut" style="margin:4px 0 8px">Paste a direct link (https://… .gif, .jpg, .png). Leave empty to go back to the built-in demo.</div><input type="text" id="mu" value="${esc(media[it.n]||"")}" placeholder="https://…"><div class="g g2" style="margin-top:10px"><button class="btn s" style="width:100%" data-a="mno">Cancel</button><button class="btn" data-a="meds" data-n="${esc(it.n)}">Save</button></div>`);break;
 case"meds":{const u=$("#mu").value.trim();if(u&&!/^https?:\/\//i.test(u)){toast("Link must start with http:// or https://",1);break}if(u)media[t.dataset.n]=u;else delete media[t.dataset.n];ls.s("ip2_media",media);X();render();break}
 case"imp":importText($("#imp").value);break;
 case"wipe":ask("Delete <b>all</b> saved workouts? This can’t be undone — export a backup first.","Delete all",async()=>{if(await persistHist([])){X();render();toast("All workout data deleted")}else toast("Failed — storage error",1)});break}});
function startS(){sess={startedAt:new Date().toISOString(),acc:0,since:Date.now(),run:true};save()}
document.addEventListener("change",ev=>{const t=ev.target,f=t.dataset.f;if(!f)return;const c=t.closest("[data-i]"),it=c?plan[+c.dataset.i]:null,j=+t.dataset.j;
 if(f==="file"){const r=t.files[0];if(r)r.text().then(importText).catch(()=>toast("Could not read file",1));t.value="";return}
 if(f==="fr"){filt.r=t.value;render();return}if(f==="fm"){filt.m=t.value;render();return}if(f==="pk"){progKey=t.value;render();return}
 if(f==="th"){cfg.theme=t.value;ls.s("ip2_cfg",cfg);render();return}if(f==="dr"){cfg.rest=+t.value;ls.s("ip2_cfg",cfg);return}if(f==="au"){cfg.auto=t.checked;ls.s("ip2_cfg",cfg);return}
 if(!it)return;
 if(f==="v")it.v=t.value;
 else if(f==="t"){it.t=t.value;it.tr=it.t==="t"?45:it.t==="c"?15:10;it.sets=(it.t==="c"?it.sets.slice(0,1):it.sets).map(s=>({w:0,r:it.tr,done:false}))}
 else if(f==="ns"){const n=+t.value;while(it.sets.length>n)it.sets.pop();while(it.sets.length<n){const l=it.sets[it.sets.length-1]||{w:0,r:it.tr};it.sets.push({w:l.w,r:l.r,done:false})}}
 else if(f==="tr"){it.tr=+t.value;it.sets.forEach(s=>{if(!s.done)s.r=it.tr})}
 else if(f==="rest")it.rest=+t.value;
 else if(f==="wall"){if(t.value!=="")it.sets.forEach(s=>{if(!s.done){s.w=+t.value;s.cust=false}})}
 else if(f==="w"){if(t.value==="__c")it.sets[j].cust=true;else it.sets[j].w=+t.value}
 else if(f==="wc"){const v=parseFloat(t.value);if(isFinite(v)&&v>=0&&v<=999)it.sets[j].w=v;else toast("Enter a weight between 0 and 999",1)}
 else if(f==="r")it.sets[j].r=+t.value;
 else if(f==="note"){it.note=t.value;save();return}
 save();render()});
// ---------- timers (timestamp based) ----------
function tick(){document.querySelectorAll(".tm").forEach(e=>e.textContent=fmtT(el()/1000));
 if(rest.end){const l=Math.ceil((rest.end-Date.now())/1e3);if(l<=0){rest.end=0;toast("Rest over — next set 💪");try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}else{$("#rb").style.display="flex";$("#rt").textContent=fmtT(l).slice(3);return}}
 $("#rb").style.display="none"}
setInterval(tick,500);
boot();
</script>
</body>
</html>
